services:
  - type: web
    name: noira
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 server.app:app
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: BAROMETR_DB_SCHEMA
        value: allin_barometr
      - key: ADMIN1_USERNAME
        sync: false
      - key: ADMIN1_PASSWORD
        sync: false
